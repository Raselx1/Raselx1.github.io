<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasel Islam – Portfolio</title>
<meta name="description" content="Network engineer moving into DevOps and cloud. Plan, learning and experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#14213d;--mute:#5b6783;--line:#d9e0ec;--accent:#2b59ff;--done:#1fa67a;--next:#b8c2d6;
--head:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--panel:#161e34;--ink:#eef2fb;--mute:#97a3c0;--line:#27324f;--accent:#6e8cff;--done:#38c996;--next:#3a4668}}
:root[data-theme=dark]{--bg:#0e1424;--panel:#161e34;--ink:#eef2fb;--mute:#97a3c0;--line:#27324f;--accent:#6e8cff;--done:#38c996;--next:#3a4668}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
nav a{margin-left:20px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px}
nav a:hover{color:var(--ink)}
button.theme{margin-left:20px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.hero{padding:64px 0 48px}
.hero h1{font:800 clamp(40px,8vw,84px)/1.02 var(--head);letter-spacing:-.03em;margin:0 0 20px}
.hero p{max-width:56ch;color:var(--mute);font-size:20px;margin:0 0 28px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line);margin-left:10px}
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font:800 32px/1.1 var(--head);letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 32px;max-width:60ch}
/* roadmap */
.road{list-style:none;margin:0;padding:0 0 0 28px;border-left:3px solid var(--next)}
.road li{position:relative;padding:0 0 28px 20px}
.road li::before{content:"";position:absolute;left:-39px;top:5px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--next)}
.road li.done{--c:var(--done)}.road li.doing{--c:var(--accent)}
.road li.done::before{background:var(--done);border-color:var(--done)}
.road li.doing::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.road h3{margin:0;font:600 19px var(--head)}
.road .when{font-size:14px;color:var(--mute)}
.road p{margin:4px 0 0;color:var(--mute)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--c,var(--next));color:var(--c,var(--mute));margin-left:8px;vertical-align:2px}
/* learning */
.learn{display:grid;gap:18px}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.skill .row{display:flex;justify-content:space-between;font-weight:600}
.skill small{color:var(--mute);font-weight:400}
.bar{height:8px;background:var(--line);border-radius:9px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
/* experience */
.job{display:grid;grid-template-columns:150px 1fr;gap:6px 24px;padding:0 0 28px}
.job .date{color:var(--mute);font-size:15px}
.job h3{margin:0;font:600 20px var(--head)}
.job .org{color:var(--accent);font-weight:600}
.job ul{margin:8px 0 0;padding-left:18px;color:var(--mute)}
/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;text-decoration:none;display:block}
.proj h3{margin:0 0 6px;font:600 20px var(--head)}
.proj p{margin:0 0 10px;color:var(--mute);font-size:16px}
.proj span{font-size:14px;color:var(--accent);font-weight:600}
footer{padding:36px 0 56px;border-top:1px solid var(--line);color:var(--mute);font-size:15px}
.links a{margin-right:18px;font-weight:600}
@media(max-width:620px){.job{grid-template-columns:1fr}nav a:not(.keep){display:none}.btn.alt{margin:10px 0 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <strong id="logo" style="font-family:var(--head);font-size:20px"></strong>
    <nav><a href="#plan">Plan</a><a href="#learning">Learning</a><a href="#experience">Experience</a><a href="#projects">Projects</a><a class="keep" href="#contact">Contact</a><button class="theme" id="theme" aria-label="Toggle dark mode">Theme</button></nav>
  </header>

  <div class="hero">
    <h1 id="headline"></h1>
    <p id="intro"></p>
    <a class="btn" href="#plan">See my plan</a><a class="btn alt" href="cv.pdf" download>Download CV</a><a class="btn alt" href="#contact">Get in touch</a>
  </div>

  <section id="plan"><h2>My plan</h2><p class="sub" id="planSub"></p><ol class="road" id="road"></ol></section>
  <section id="learning"><h2>What I'm learning</h2><p class="sub" id="learnSub"></p><div class="learn" id="learn"></div></section>
  <section id="experience"><h2>Experience</h2><p class="sub" id="expSub"></p><div id="exp"></div></section>
  <section id="projects"><h2>Projects</h2><p class="sub" id="projSub"></p><div class="projects" id="proj"></div></section>

  <footer id="contact">
    <h2 style="font-size:26px">Let's talk</h2>
    <p id="contactText"></p>
    <p class="links" id="links"></p>
    <p>© <span id="yr"></span> <span id="foot"></span></p>
  </footer>
</div>

<script>
/* ============ EDIT ONLY THIS BLOCK ============ */
const CONFIG = {
  name: "Your Name",
  headline: "Network engineer, building my way into DevOps and cloud.",
  intro: "I run and troubleshoot production networks today, and I'm moving toward automation, cloud infrastructure and DevOps. This page shows my plan, what I'm learning, and what I've done so far.",
  email: "raselbyte@gmail.com",
  links: [{label:"GitHub",url:"https://github.com/yourname"},{label:"LinkedIn",url:"https://linkedin.com/in/yourname"}],
  planSub: "From network engineer to DevOps and cloud engineer.",
  plan: [
    {title:"Network engineering foundation", when:"Done", status:"done", text:"Routing, switching, firewalls and day-to-day operations (CCNA level or above)."},
    {title:"Linux, Git and scripting", when:"2026", status:"doing", text:"Bash and Python for automation, plus daily Git use."},
    {title:"Cloud certification", when:"2026", status:"next", text:"AWS Cloud Practitioner, then Solutions Architect Associate."},
    {title:"Containers and Infrastructure as Code", when:"2026–27", status:"next", text:"Docker, Kubernetes basics and Terraform."},
    {title:"First DevOps or cloud engineer role", when:"2027", status:"next", text:"CI/CD, monitoring and cloud networking in a real team."}
  ],
  learnSub: "What I'm studying now, with an honest progress level.",
  learning: [
    {skill:"Linux administration", level:60, note:"Daily use, services, permissions, troubleshooting"},
    {skill:"Python and Bash automation", level:45, note:"Netmiko, Ansible and small scripts"},
    {skill:"AWS (VPC, EC2, IAM)", level:30, note:"Cloud networking is my bridge from networking"},
    {skill:"Docker and Kubernetes", level:20, note:"Just started"},
    {skill:"Terraform and CI/CD", level:10, note:"Next on the list"}
  ],
  expSub: "Where I've worked.",
  experience: [
    {role:"Network Engineer", org:"Your Company", date:"20XX – Present", points:["Manage and monitor LAN, WAN and firewall infrastructure.","Troubleshoot outages and improve network uptime.","Automate repetitive tasks with scripts."]},
    {role:"Junior Network Engineer", org:"Previous Company", date:"20XX – 20XX", points:["Configured switches and routers.","Supported the NOC and handled tickets."]}
  ],
  projSub: "Hands-on labs and projects (replace with your own).",
  projects: [
    {name:"Home network lab", text:"Multi-VLAN lab with routing and firewall rules built in GNS3.", url:"#", stack:"GNS3 · Cisco · pfSense"},
    {name:"Network automation scripts", text:"Python scripts that back up configs from many devices at once.", url:"#", stack:"Python · Netmiko · Git"},
    {name:"Cloud VPC on AWS", text:"VPC with public and private subnets, written as Terraform code.", url:"#", stack:"AWS · Terraform"}
  ],
  contactText: "Open to network, DevOps and cloud opportunities, and to talking with people in the field. Email is the best way to reach me."
};
/* ============================================== */

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=CONFIG, label={done:"Done",doing:"In progress",next:"Next"};
document.title=C.name+" – Portfolio";
$("logo").textContent=C.name; $("headline").textContent=C.headline; $("intro").textContent=C.intro;
$("planSub").textContent=C.planSub; $("learnSub").textContent=C.learnSub; $("expSub").textContent=C.expSub; $("projSub").textContent=C.projSub;
$("contactText").textContent=C.contactText; $("foot").textContent=C.name; $("yr").textContent=new Date().getFullYear();
$("road").innerHTML=C.plan.map(p=>`<li class="${esc(p.status)}"><h3>${esc(p.title)}<span class="tag">${label[p.status]||""}</span></h3><div class="when">${esc(p.when)}</div><p>${esc(p.text)}</p></li>`).join("");
$("learn").innerHTML=C.learning.map(s=>`<div class="skill"><div class="row"><span>${esc(s.skill)}</span><span>${+s.level}%</span></div><div class="bar" role="progressbar" aria-valuenow="${+s.level}" aria-valuemin="0" aria-valuemax="100"><i style="width:${+s.level}%"></i></div><small>${esc(s.note)}</small></div>`).join("");
$("exp").innerHTML=C.experience.map(j=>`<div class="job"><div class="date">${esc(j.date)}</div><div><h3>${esc(j.role)}</h3><div class="org">${esc(j.org)}</div><ul>${j.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div></div>`).join("");
$("proj").innerHTML=C.projects.map(p=>`<a class="proj" href="${esc(p.url)}"><h3>${esc(p.name)}</h3><p>${esc(p.text)}</p><span>${esc(p.stack)}</span></a>`).join("");
$("links").innerHTML=`<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`+C.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("theme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0e1424';r.dataset.theme=dark?'light':'dark'};
</script>
</body>
</html>
